    <<: *fixture
    profiles: [equal-capacity]
    ports: ["127.0.0.1:5101:8080"]
    environment:
      <<: *fixture-environment
      FIXTURE_ID: equal-1
      FIXTURE_CAPACITY: "4"
      FIXTURE_LATENCY_MS: "10"
      FIXTURE_PROCESSING_MS: "40"
      FIXTURE_SEED: "101"

