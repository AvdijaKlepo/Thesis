name: webserver-fixtures

x-fixture: &fixture
  build:
    context: ./server
    dockerfile: Dockerfile.fixture
  image: webserver-backend-fixture:local
  restart: "no"
  environment: &fixture-environment
    FIXTURE_LISTEN: "0.0.0.0:8080"
    FIXTURE_ERROR_RATE: "0.0"
    FIXTURE_ERROR_MODE: status
    FIXTURE_LATENCY_JITTER_MS: "0"
    FIXTURE_SEED: "1"

services:
