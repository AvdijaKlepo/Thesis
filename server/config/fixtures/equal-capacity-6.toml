[server]
proxy_address = "127.0.0.1:7879"
control_address = "127.0.0.1:7878"
admin_address = "127.0.0.1:7880"
web_root = "../../web"
thread_pool_size = 16
runtime = "async"
default_service = "fixture"

[health]
enabled = true
interval_ms = 1000
timeout_ms = 250
unhealthy_threshold = 2
healthy_threshold = 2

[observability]
log_requests = false

[[services]]
id = "fixture"
kind = "proxy"
algorithm = "round_robin"
fail_open = false
routes = [{ path_prefix = "/" }]
backends = [
    { id = "equal6-1", address = "127.0.0.1:6901", weight = 1 },
    { id = "equal6-2", address = "127.0.0.1:6902", weight = 1 },
    { id = "equal6-3", address = "127.0.0.1:6903", weight = 1 },
    { id = "equal6-4", address = "127.0.0.1:6904", weight = 1 },
    { id = "equal6-5", address = "127.0.0.1:6905", weight = 1 },
    { id = "equal6-6", address = "127.0.0.1:6906", weight = 1 },
]

