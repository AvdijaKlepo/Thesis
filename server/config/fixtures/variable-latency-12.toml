[server]
proxy_address = "127.0.0.1:7879"
control_address = "127.0.0.1:7878"
admin_address = "127.0.0.1:7880"
web_root = "../../web"
thread_pool_size = 16
runtime = "async"
default_service = "fixture"

[health]
enabled = true
interval_ms = 1000
timeout_ms = 250
unhealthy_threshold = 2
healthy_threshold = 2

[observability]
log_requests = false

[[services]]
id = "fixture"
kind = "proxy"
algorithm = "round_robin"
fail_open = false
routes = [{ path_prefix = "/" }]
backends = [
    { id = "latency12-fast-1", address = "127.0.0.1:6701", weight = 1 },
    { id = "latency12-fast-2", address = "127.0.0.1:6702", weight = 1 },
    { id = "latency12-fast-3", address = "127.0.0.1:6703", weight = 1 },
    { id = "latency12-fast-4", address = "127.0.0.1:6704", weight = 1 },
    { id = "latency12-variable-1", address = "127.0.0.1:6705", weight = 1 },
    { id = "latency12-variable-2", address = "127.0.0.1:6706", weight = 1 },
    { id = "latency12-variable-3", address = "127.0.0.1:6707", weight = 1 },
    { id = "latency12-variable-4", address = "127.0.0.1:6708", weight = 1 },
    { id = "latency12-slow-1", address = "127.0.0.1:6709", weight = 1 },
    { id = "latency12-slow-2", address = "127.0.0.1:6710", weight = 1 },
    { id = "latency12-slow-3", address = "127.0.0.1:6711", weight = 1 },
