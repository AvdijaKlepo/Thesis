[server]
proxy_address = "127.0.0.1:7879"
control_address = "127.0.0.1:7878"
admin_address = "127.0.0.1:7880"
web_root = "../../web"
thread_pool_size = 16
runtime = "thread_pool"
default_service = "fixture"

[health]
enabled = true
interval_ms = 1000
timeout_ms = 250
unhealthy_threshold = 2
healthy_threshold = 2

[observability]
log_requests = false

[[services]]
id = "fixture"
kind = "proxy"
algorithm = "round_robin"
fail_open = false
routes = [{ path_prefix = "/" }]
backends = [
    { id = "latency-fast", address = "127.0.0.1:5301", weight = 1 },
    { id = "latency-variable", address = "127.0.0.1:5302", weight = 1 },
    { id = "latency-slow", address = "127.0.0.1:5303", weight = 1 },
]
