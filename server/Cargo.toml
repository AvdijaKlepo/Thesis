[package]
name = "server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "backend-fixture"
path = "src/bin/backend_fixture.rs"

[[bin]]
name = "scenario-runner"
path = "src/bin/scenario_runner.rs"

[[bin]]
name = "serverctl"
path = "src/bin/serverctl.rs"

[dependencies]
arc-swap = "1.9.2"
tiny_http = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
