# Run from server/: cargo run --release --bin scenario-runner -- run ../experiments/backend-cardinality-calibration.toml
schema_version = 1
name = "backend-cardinality-calibration"
seed = 20260920
repetitions = 1
output_directory = "../results"
algorithms = ["round_robin"]
runtimes = ["async"]
paired_workload_seeds = true
execution_order = "blocked_randomized"

[server]
command = "target/release/server"
args = ["--config", "{server_config}"]
working_directory = "../server"
startup_timeout_ms = 15000
request_timeout_ms = 10000
version = "0.1.0"

[[scenarios]]
id = "calibration-3"
description = "Low-load equal-backend calibration with three replicas."
server_config = "../server/config/fixtures/equal-capacity-3.toml"
workload_seed_group = "equal-calibration"
slo_target_ms = 100

[[scenarios.setup]]
command = "docker"
args = ["compose", "-p", "webserver-scaled-{scenario}", "-f", "compose.scaled-fixtures.yml", "--profile", "equal-capacity-3", "up", "--build", "--force-recreate", "--wait", "--wait-timeout", "60", "equal3-1", "equal3-2", "equal3-3"]
working_directory = ".."

[[scenarios.teardown]]
command = "docker"
args = ["compose", "-p", "webserver-scaled-{scenario}", "-f", "compose.scaled-fixtures.yml", "--profile", "equal-capacity-3", "down", "--timeout", "0"]
working_directory = ".."

[[scenarios.workloads]]
id = "calibration-reads"
requests = 240
concurrency = 12
method = "GET"
path = "/experiment"
requests_per_second = 24.0
jitter_ms = 2
timeout_ms = 10000

[[scenarios.analysis_windows]]
id = "warmup"
start_ms = 0
end_ms = 2000

[[scenarios.analysis_windows]]
id = "steady"
start_ms = 2000
end_ms = 10000

[[scenarios.collect]]
id = "equal3-1-config"
address = "127.0.0.1:6801"
path = "/config"
phases = ["before", "after"]

[[scenarios.collect]]
id = "equal3-1-metrics"
address = "127.0.0.1:6801"
path = "/metrics"
phases = ["before", "after"]

[[scenarios.collect]]
id = "equal3-2-config"
address = "127.0.0.1:6802"
path = "/config"
phases = ["before", "after"]

[[scenarios.collect]]
id = "equal3-2-metrics"
address = "127.0.0.1:6802"
path = "/metrics"
phases = ["before", "after"]

[[scenarios.collect]]
id = "equal3-3-config"
address = "127.0.0.1:6803"
path = "/config"
phases = ["before", "after"]

[[scenarios.collect]]
id = "equal3-3-metrics"
address = "127.0.0.1:6803"
path = "/metrics"
phases = ["before", "after"]

