# Run from server/: cargo run --release --bin scenario-runner -- run ../experiments/variable-latency.toml
schema_version = 1
name = "variable-latency"
seed = 20260915
repetitions = 3
output_directory = "../results"
algorithms = ["round_robin", "weighted_round_robin", "least_connections", "least_response_time"]
runtimes = ["thread_pool", "async"]

[server]
command = "target/release/server"
args = ["--config", "{server_config}"]
working_directory = "../server"
startup_timeout_ms = 15000
request_timeout_ms = 10000
version = "0.1.0"

[[scenarios]]
id = "variable-latency"
description = "Offer 100 requests/s to fast, seeded-variable, and slow backends; compare tail latency and adaptive allocation."
server_config = "../server/config/fixtures/variable-latency.toml"

# A dedicated Compose project and recreated containers reset fixture state per run.
# Published ports are shared with the manual profiles: run only one experiment at a time.
[[scenarios.setup]]
command = "docker"
args = [
    "compose", "-p", "webserver-benchmark-{scenario}", "-f", "compose.fixtures.yml",
    "--profile", "variable-latency", "up", "--build", "--force-recreate",
    "--wait", "--wait-timeout", "60",
    "latency-fast", "latency-variable", "latency-slow",
]
working_directory = ".."

[[scenarios.teardown]]
command = "docker"
args = [
    "compose", "-p", "webserver-benchmark-{scenario}", "-f", "compose.fixtures.yml",
    "--profile", "variable-latency", "down", "--timeout", "0",
]
working_directory = ".."

[[scenarios.workloads]]
id = "steady-reads"
requests = 1000
concurrency = 64
method = "GET"
path = "/experiment"
requests_per_second = 100.0
jitter_ms = 2
timeout_ms = 10000

[[scenarios.collect]]
id = "latency-fast-config"
address = "127.0.0.1:5301"
path = "/config"
phases = ["before"]

[[scenarios.collect]]
id = "latency-fast-metrics"
address = "127.0.0.1:5301"
path = "/metrics"
phases = ["before", "after"]

[[scenarios.collect]]
id = "latency-variable-config"
address = "127.0.0.1:5302"
path = "/config"
phases = ["before"]

[[scenarios.collect]]
id = "latency-variable-metrics"
address = "127.0.0.1:5302"
path = "/metrics"
phases = ["before", "after"]

[[scenarios.collect]]
id = "latency-slow-config"
address = "127.0.0.1:5303"
path = "/config"
phases = ["before"]

[[scenarios.collect]]
id = "latency-slow-metrics"
address = "127.0.0.1:5303"
path = "/metrics"
phases = ["before", "after"]

