# Run from server/: cargo run --release --bin scenario-runner -- run ../experiments/saturation-sweep-12.toml
schema_version = 1
name = "saturation-sweep-12"
seed = 20260926
repetitions = 5
output_directory = "../results"
algorithms = ["round_robin", "weighted_round_robin", "least_connections", "least_response_time", "adaptive_balancing", "adaptive_balancing_v2"]
runtimes = ["async"]
paired_workload_seeds = true
execution_order = "blocked_randomized"

[server]
command = "target/release/server"
args = ["--config", "{server_config}"]
working_directory = "../server"
startup_timeout_ms = 15000
request_timeout_ms = 10000
version = "0.1.0"

[[scenarios]]
id = "saturation-light"
description = "Low offered load against the twelve-backend equal-capacity pool."
server_config = "../server/config/fixtures/equal-capacity-12.toml"
workload_seed_group = "saturation-sweep-12"
slo_target_ms = 100

[[scenarios.setup]]
command = "docker"
args = ["compose", "-p", "webserver-scaled-{scenario}", "-f", "compose.scaled-fixtures.yml", "--profile", "equal-capacity-12", "up", "--build", "--force-recreate", "--wait", "--wait-timeout", "60", "equal12-1", "equal12-2", "equal12-3", "equal12-4", "equal12-5", "equal12-6", "equal12-7", "equal12-8", "equal12-9", "equal12-10", "equal12-11", "equal12-12"]
working_directory = ".."

[[scenarios.teardown]]
command = "docker"
args = ["compose", "-p", "webserver-scaled-{scenario}", "-f", "compose.scaled-fixtures.yml", "--profile", "equal-capacity-12", "down", "--timeout", "0"]
working_directory = ".."

[[scenarios.workloads]]
id = "paced-reads"
requests = 600
concurrency = 128
method = "GET"
path = "/experiment"
requests_per_second = 60.0
jitter_ms = 2
timeout_ms = 10000

[[scenarios.analysis_windows]]
id = "warmup"
start_ms = 0
end_ms = 3000

[[scenarios.analysis_windows]]
id = "steady"
start_ms = 3000
end_ms = 10000

