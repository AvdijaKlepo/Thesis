# Run from server/: cargo run --release --bin scenario-runner -- run ../experiments/adaptive-cardinality.toml
schema_version = 1
name = "adaptive-cardinality"
seed = 20260922
repetitions = 10
output_directory = "../results"
algorithms = ["round_robin", "weighted_round_robin", "least_connections", "least_response_time", "adaptive_balancing", "adaptive_balancing_v2"]
runtimes = ["async"]
paired_workload_seeds = true
execution_order = "blocked_randomized"

[server]
command = "target/release/server"
args = ["--config", "{server_config}"]
working_directory = "../server"
startup_timeout_ms = 15000
request_timeout_ms = 10000
version = "0.1.0"

[[scenarios]]
id = "cardinality-3"
description = "Controlled variable-latency comparison with three backends and twelve total fixture workers."
server_config = "../server/config/fixtures/cardinality-3.toml"
workload_seed_group = "adaptive-cardinality"
slo_target_ms = 200

[[scenarios.setup]]
command = "docker"
args = ["compose", "-p", "webserver-scaled-{scenario}", "-f", "compose.scaled-fixtures.yml", "--profile", "cardinality-3", "up", "--build", "--force-recreate", "--wait", "--wait-timeout", "60", "card3-fast-1", "card3-variable-1", "card3-slow-1"]
working_directory = ".."

[[scenarios.teardown]]
command = "docker"
args = ["compose", "-p", "webserver-scaled-{scenario}", "-f", "compose.scaled-fixtures.yml", "--profile", "cardinality-3", "down", "--timeout", "0"]
working_directory = ".."

[[scenarios.workloads]]
id = "steady-reads"
requests = 1800
concurrency = 96
method = "GET"
path = "/experiment"
requests_per_second = 180.0
jitter_ms = 2
timeout_ms = 10000

[[scenarios.analysis_windows]]
id = "warmup"
start_ms = 0
end_ms = 3000

[[scenarios.analysis_windows]]
id = "steady"
start_ms = 3000
end_ms = 10000

[[scenarios.collect]]
id = "card3-fast-1-config"
address = "127.0.0.1:6101"
path = "/config"
phases = ["before", "after"]

[[scenarios.collect]]
id = "card3-fast-1-metrics"
address = "127.0.0.1:6101"
path = "/metrics"
phases = ["before", "after"]

[[scenarios.collect]]
id = "card3-variable-1-config"
address = "127.0.0.1:6102"
path = "/config"
phases = ["before", "after"]

[[scenarios.collect]]
id = "card3-variable-1-metrics"
address = "127.0.0.1:6102"
path = "/metrics"
phases = ["before", "after"]

[[scenarios.collect]]
id = "card3-slow-1-config"
address = "127.0.0.1:6103"
path = "/config"
phases = ["before", "after"]

[[scenarios.collect]]
id = "card3-slow-1-metrics"
address = "127.0.0.1:6103"
path = "/metrics"
phases = ["before", "after"]

