# Run from server/: cargo run --release --bin scenario-runner -- run ../experiments/adaptive-phase-change-12.toml
schema_version = 1
name = "adaptive-phase-change-12"
seed = 20260929
repetitions = 5
output_directory = "../results"
algorithms = ["round_robin", "weighted_round_robin", "least_connections", "least_response_time", "adaptive_balancing", "adaptive_balancing_v2"]
runtimes = ["async"]
paired_workload_seeds = true
execution_order = "blocked_randomized"

[server]
command = "target/release/server"
args = ["--config", "{server_config}"]
working_directory = "../server"
startup_timeout_ms = 15000
request_timeout_ms = 10000
version = "0.1.0"

[[scenarios]]
id = "adaptive-phase-change-12"
description = "Swap fast and slow latency cohorts after warm-up, then restore them to measure adaptation and recovery."
server_config = "../server/config/fixtures/variable-latency-12.toml"
workload_seed_group = "adaptive-phase-change-12"
slo_target_ms = 200

[[scenarios.setup]]
command = "docker"
args = ["compose", "-p", "webserver-scaled-{scenario}", "-f", "compose.scaled-fixtures.yml", "--profile", "variable-latency-12", "up", "--build", "--force-recreate", "--wait", "--wait-timeout", "60", "latency12-fast-1", "latency12-fast-2", "latency12-fast-3", "latency12-fast-4", "latency12-variable-1", "latency12-variable-2", "latency12-variable-3", "latency12-variable-4", "latency12-slow-1", "latency12-slow-2", "latency12-slow-3", "latency12-slow-4"]
working_directory = ".."

[[scenarios.teardown]]
command = "docker"
args = ["compose", "-p", "webserver-scaled-{scenario}", "-f", "compose.scaled-fixtures.yml", "--profile", "variable-latency-12", "down", "--timeout", "0"]
working_directory = ".."

[[scenarios.fixture_changes]]
id = "swap-fast-to-slow-1"
at_ms = 5000
address = "127.0.0.1:6701"
patch = { latency_ms = 120 }

[[scenarios.fixture_changes]]
id = "swap-fast-to-slow-2"
at_ms = 5000
address = "127.0.0.1:6702"
