[[scenarios.workloads]]
id = "phase-change-reads"
requests = 3200
concurrency = 96
method = "GET"
path = "/experiment"
requests_per_second = 200.0
jitter_ms = 2
timeout_ms = 10000

[[scenarios.analysis_windows]]
id = "warmup"
start_ms = 0
end_ms = 5000

[[scenarios.analysis_windows]]
id = "swapped"
start_ms = 5000
end_ms = 11000

[[scenarios.analysis_windows]]
id = "recovery"
start_ms = 11000
