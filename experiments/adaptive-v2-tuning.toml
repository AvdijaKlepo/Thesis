# Run from server/: cargo run --release --bin scenario-runner -- run ../experiments/adaptive-v2-tuning.toml
schema_version = 1
name = "adaptive-v2-tuning"
seed = 20260921
repetitions = 3
output_directory = "../results"
algorithms = ["adaptive_balancing_v2"]
runtimes = ["async"]
paired_workload_seeds = true
execution_order = "blocked_randomized"

[server]
command = "target/release/server"
args = ["--config", "{server_config}"]
working_directory = "../server"
startup_timeout_ms = 15000
request_timeout_ms = 10000
version = "0.1.0"

[[scenarios]]
id = "tuning-balanced"
description = "Deadline and latency rewards use the default v2 settings."
server_config = "../server/config/fixtures/adaptive-v2-tuning-balanced.toml"
workload_seed_group = "adaptive-v2-pilot"
slo_target_ms = 200

[[scenarios.setup]]
command = "docker"
args = ["compose", "-p", "webserver-scaled-{scenario}", "-f", "compose.scaled-fixtures.yml", "--profile", "cardinality-6", "up", "--build", "--force-recreate", "--wait", "--wait-timeout", "60", "card6-fast-1", "card6-fast-2", "card6-variable-1", "card6-variable-2", "card6-slow-1", "card6-slow-2"]
working_directory = ".."

[[scenarios.teardown]]
command = "docker"
args = ["compose", "-p", "webserver-scaled-{scenario}", "-f", "compose.scaled-fixtures.yml", "--profile", "cardinality-6", "down", "--timeout", "0"]
working_directory = ".."

[[scenarios.workloads]]
id = "pilot-reads"
requests = 1200
concurrency = 48
method = "GET"
path = "/experiment"
requests_per_second = 120.0
jitter_ms = 2
timeout_ms = 10000

[[scenarios.analysis_windows]]
id = "warmup"
start_ms = 0
end_ms = 3000

[[scenarios.analysis_windows]]
id = "steady"
start_ms = 3000
end_ms = 10000

[[scenarios.collect]]
id = "card6-fast-1-config"
address = "127.0.0.1:6201"
path = "/config"
phases = ["before", "after"]

[[scenarios.collect]]
id = "card6-fast-1-metrics"
address = "127.0.0.1:6201"
path = "/metrics"
phases = ["before", "after"]

[[scenarios.collect]]
id = "card6-fast-2-config"
address = "127.0.0.1:6202"
path = "/config"
phases = ["before", "after"]

[[scenarios.collect]]
id = "card6-fast-2-metrics"
address = "127.0.0.1:6202"
path = "/metrics"
phases = ["before", "after"]

[[scenarios.collect]]
id = "card6-variable-1-config"
address = "127.0.0.1:6203"
path = "/config"
phases = ["before", "after"]

[[scenarios.collect]]
